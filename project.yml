# XcodeGen spec. Run `xcodegen` to create RemoteControl.xcodeproj (it isn't committed).
name: RemoteControl
options:
  bundleIdPrefix: com.ztwalsh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  TVKit:
    path: Packages/TVKit

targets:
  RemoteControl:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: TVKit
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Remote
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Remote finds and controls the TVs on your Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ztwalsh.RemoteControl
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Set your team to run on a device. Add RemoteControl.entitlements once Apple grants
        # the multicast entitlement (see README).
        DEVELOPMENT_TEAM: HSZZQ94DM7
        CODE_SIGN_STYLE: Automatic

