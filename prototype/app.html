<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Remote Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one iPhone-sized app, matching the native app screen for screen. On a desktop it sits in a
   device frame scaled to the window; on a phone it fills the screen. App colors are set from JS
   (Mono or a theme color, light or dark), the page around the frame follows the viewer's theme. */
:root {
  --stage: #E4E4E8;
  --bezel: #1B1B1E;
  --stage-ring: rgba(0, 0, 0, 0.12);
  --stage-text: #6E6E73;
  --stage-strong: #111113;
  --spring: cubic-bezier(.2, .9, .1, 1);
  --pop: cubic-bezier(.34, 1.56, .64, 1);
  --font: -apple-system, "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --stage: #050506; --stage-ring: rgba(255, 255, 255, 0.1); --stage-text: #8B8B90; --stage-strong: #F2F2F3; color-scheme: dark; } }
:root[data-theme="dark"] { --stage: #050506; --stage-ring: rgba(255, 255, 255, 0.1); --stage-text: #8B8B90; --stage-strong: #F2F2F3; color-scheme: dark; }
.back { position: fixed; z-index: 50; top: max(16px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: inline-flex; align-items: center; gap: 4px; padding: 8px 12px 8px 8px; border-radius: 18px; color: var(--stage-text); font: 500 14px var(--font); text-decoration: none; }
.back:hover { color: var(--stage-strong); }
.back svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 500px) { .back { display: none; } }
html, body { height: 100%; }
body { background: var(--stage); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; margin: 0; }
button, input { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:focus { outline: none; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: -1px; padding: 0; border: 0; }
.ic { display: block; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.stage { height: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.fit { position: relative; width: calc(412px * var(--s, 1)); height: calc(866px * var(--s, 1)); flex: none; }
.fit::before { content: ""; position: absolute; inset: 0; border-radius: calc(58px * var(--s, 1)); box-shadow: 0 0 0 1px var(--stage-ring), 0 40px 120px rgba(0, 0, 0, 0.45); pointer-events: none; }
.device { width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--text); border: 11px solid var(--bezel); border-radius: 58px; transform: scale(var(--s, 1)); transform-origin: top left; transition: background-color 300ms ease; }

/* Main screen */
.app { position: absolute; inset: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 62px 22px 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.top { display: flex; align-items: center; gap: 12px; }
.tv-switch { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.tv-name { display: flex; align-items: center; gap: 6px; font-size: 27px; font-weight: 600; letter-spacing: -0.015em; color: var(--text); }
.tv-name .ic { color: var(--muted); }
.tv-status { font-size: 15px; color: var(--muted); }
.power { width: 54px; height: 54px; border-radius: 27px; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; background: var(--accent); color: var(--onaccent); transition: transform 420ms var(--pop), opacity 200ms ease; }
.power:active { transform: scale(0.92); }
.app.is-off .power { opacity: 0; transform: scale(0.8); pointer-events: none; visibility: hidden; }
.scroll { flex: 1; overflow-y: auto; scrollbar-width: none; margin: 0 -22px; padding: 0 22px 34px; transition: opacity 320ms ease, transform 420ms var(--spring); }
.scroll::-webkit-scrollbar { display: none; }
.app.is-off .scroll { opacity: 0; transform: scale(0.97); pointer-events: none; visibility: hidden; transition: opacity 320ms ease, transform 420ms var(--spring), visibility 0s 320ms; }
.tools { display: flex; flex-direction: column; gap: 12px; }
.offview { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transform: scale(0.96); transition: opacity 320ms ease, transform 420ms var(--spring); }
.app.is-off .offview { opacity: 1; transform: none; pointer-events: auto; }
.wake { width: 168px; height: 168px; border-radius: 84px; border: 0; background: var(--card); color: var(--accent); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 460ms var(--pop); }
.wake:active { transform: scale(0.95); }

.card { background: var(--card); border-radius: 26px; padding: 20px; display: flex; flex-direction: column; }
.card h2, .sheet h2 { margin: 0; font-size: 21px; font-weight: 600; color: var(--text); }
.vol-head { display: flex; align-items: flex-start; justify-content: space-between; }
.vol-num { display: flex; align-items: baseline; gap: 6px; margin-top: 6px; font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
.vol-num .roll { color: var(--text); font-weight: 500; }
.controls { display: flex; gap: 8px; align-items: center; }
.round { width: 38px; height: 38px; border-radius: 19px; border: 0; background: var(--raised); color: var(--text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; transition: background-color 200ms ease, color 200ms ease; }
.round[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.stepper { display: flex; align-items: center; height: 38px; border-radius: 19px; background: var(--raised); }
.stepper button { width: 44px; height: 38px; border: 0; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: none; }
.stepper i { width: 1px; height: 18px; background: var(--linestrong); }
.vbar { position: relative; height: 96px; margin-top: -16px; touch-action: none; cursor: ew-resize; }
.vbar svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; will-change: transform; }

.roll { display: inline-flex; height: 1.25em; line-height: 1.25em; overflow: hidden; font-variant-numeric: tabular-nums; }
.roll .col { display: block; height: 1.25em; overflow: hidden; }
.roll .stack { display: flex; flex-direction: column; transition: transform 520ms var(--spring); }
.roll.fast .stack { transition-duration: 120ms; }

.tip { position: absolute; z-index: 3; pointer-events: none; opacity: 0; transform: translateX(-50%) translateY(4px) scale(0.92); transform-origin: 50% 100%; transition: opacity 160ms ease, transform 220ms var(--spring); filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.18)); }
.tip.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
.tip-body { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 12px; background: var(--accent); color: var(--onaccent); font-size: 14px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tip-body::before { content: ""; width: 8px; height: 8px; border-radius: 4px; background: var(--onaccent); }
.tip::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: var(--accent); }

.tiles { display: flex; gap: 12px; }
.tile { flex: 1; min-width: 0; background: var(--card); border: 0; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; cursor: pointer; text-align: left; color: var(--accent); transition: transform 420ms var(--pop); }
.tile:active { transform: scale(0.97); }
.tile-label { font-size: 13px; color: var(--muted); display: block; }
.tile-value { font-size: 16px; font-weight: 600; color: var(--text); display: block; margin-top: 2px; }

.fav-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font-size: 15px; font-weight: 500; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 8px; justify-items: center; }
.fav { position: relative; background: none; border: 0; padding: 3.5px; cursor: pointer; transition: opacity 260ms ease; }
.grid.opening .fav:not(.opening) { opacity: 0.32; }
.fav .appicon { transition: transform 460ms var(--pop); }
.fav.opening { z-index: 2; }
.fav.opening .appicon { transform: translateY(-3px) scale(1.1); }
.fav .tip { left: 50%; bottom: calc(100% + 10px); }
.dot { position: absolute; left: 50%; bottom: -6px; width: 6px; height: 6px; margin-left: -3px; border-radius: 3px; background: var(--accent); animation: breathe 1.6s ease-in-out infinite alternate; }
@keyframes breathe { from { opacity: 0.35; transform: scale(0.8); } to { opacity: 1; transform: none; } }
.empty { width: 100%; min-height: 62px; background: none; border: 0; color: var(--muted); font-size: 15px; cursor: pointer; }
.appicon { display: flex; align-items: center; justify-content: center; overflow: hidden; flex: none; }
.appicon .letter { color: var(--muted); font-weight: 600; }
.menu { position: absolute; z-index: 40; min-width: 210px; background: var(--card); border-radius: 14px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3), 0 0 0 1px var(--line); overflow: hidden; animation: menu 220ms var(--spring) both; }
.menu button { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; background: none; border: 0; color: var(--text); font-size: 16px; cursor: pointer; text-align: left; }
@keyframes menu { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: none; } }
.menu-scrim { position: absolute; inset: 0; z-index: 39; background: rgba(0, 0, 0, 0.2); }

/* Sheets */
.scrim { position: absolute; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.42); opacity: 0; pointer-events: none; transition: opacity 320ms ease; border: 0; width: 100%; padding: 0; cursor: pointer; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card); border-radius: 30px 30px 0 0; display: flex; flex-direction: column; transform: translateY(calc(100% + 40px)); transition: transform 460ms var(--spring), height 360ms var(--spring); visibility: hidden; box-sizing: border-box; }
.sheet.open { transform: translateY(0); visibility: visible; }
.sheet.dragging { transition: none; }
.sheet:not(.open) { transition: transform 360ms var(--spring), visibility 0s 360ms; }
.grabber { position: absolute; top: 6px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--linestrong); }
.sheet-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px; padding: 32px 28px 24px; overflow: hidden; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; touch-action: none; }
.sheet-head h2 { font-size: 28px; }
.sheet-scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 10px; }
.sheet-scroll::-webkit-scrollbar { display: none; }
.subhead { font-size: 15px; font-weight: 600; color: var(--muted); }
.muted { color: var(--muted); font-size: 15px; }

.choice { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; border-radius: 22px; background: var(--raised); transition: background-color 220ms ease, opacity 300ms ease, transform 300ms var(--spring); }
.choice.sel { background: var(--accent); }
.choice.lift { transform: scale(1.02); }
.choice.dim { opacity: 0.3; }
.choice-pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.choice-icon { width: 44px; height: 44px; border-radius: 14px; background: var(--icontile); color: var(--muted); display: flex; align-items: center; justify-content: center; flex: none; transition: background-color 220ms ease, color 220ms ease; }
.choice.sel .choice-icon { background: color-mix(in srgb, var(--onaccent) 12%, transparent); color: var(--onaccent); }
.row-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.row-title { font-size: 17px; font-weight: 600; color: var(--text); }
.row-sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.choice.sel .row-title { color: var(--onaccent); }
.choice.sel .row-sub { color: color-mix(in srgb, var(--onaccent) 62%, transparent); }
.trail { min-width: 46px; min-height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.rowbtn { width: 46px; height: 46px; border-radius: 23px; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; background: var(--offfill); color: var(--offglyph); transition: background-color 240ms ease, color 240ms ease, transform 420ms var(--pop); animation: pop 260ms var(--spring) both; }
.rowbtn:active { transform: scale(0.9); }
.rowbtn.on { background: var(--accent); color: var(--onaccent); }
.choice.sel .rowbtn { background: color-mix(in srgb, var(--onaccent) 14%, transparent); color: var(--onaccent); }
.choice.sel .rowbtn.on { background: var(--onaccent); color: var(--accent); }
.rowbtn.plain { background: var(--icontile); color: var(--text); }
.rowbtn.danger-outline { background: var(--icontile); color: var(--danger); }
.rowbtn.danger { background: var(--danger); color: #fff; }
.choice.sel .rowbtn.plain, .choice.sel .rowbtn.danger-outline { background: color-mix(in srgb, var(--onaccent) 14%, transparent); }
.choice.sel .rowbtn.plain { color: var(--onaccent); }
@keyframes pop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: none; } }
.radio { width: 24px; height: 24px; border-radius: 12px; background: var(--icontile); color: var(--onaccent); display: flex; align-items: center; justify-content: center; transition: background-color 240ms ease, transform 420ms var(--pop); }
.radio .ic { opacity: 0; transform: scale(0.4); transition: opacity 200ms ease, transform 420ms var(--pop); }
.radio.on { background: var(--accent); transform: scale(1.05); }
.radio.on .ic { opacity: 1; transform: none; }
.choice.sel .radio { background: color-mix(in srgb, var(--onaccent) 14%, transparent); }
.choice.sel .radio.on { background: var(--onaccent); color: var(--accent); }

.pill { align-self: flex-start; height: 38px; padding: 0 14px; border-radius: 19px; border: 0; background: var(--raised); color: var(--text); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 15px; flex: none; transition: opacity 300ms ease; animation: pop 260ms var(--spring) both; }
.theme-block { display: flex; flex-direction: column; gap: 14px; padding-bottom: 12px; transition: opacity 300ms ease; }
.swatches { display: flex; justify-content: space-between; }
.swatch { width: 42px; height: 42px; border-radius: 21px; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: inset 0 0 0 2px transparent; transition: box-shadow 200ms ease, transform 300ms var(--pop); position: relative; }
.swatch:active { transform: scale(0.9); }
.swatch.on { box-shadow: inset 0 0 0 2px var(--text); }
.swatch span { width: 30px; height: 30px; border-radius: 15px; display: block; }
.swatch .mono { background: linear-gradient(90deg, #fff 50%, #111113 50%); box-shadow: inset 0 0 0 1px var(--linestrong); }
.swatch .well { background: conic-gradient(#ff375f, #ff9f0a, #ffd60a, #30d158, #0a84ff, #bf5af2, #ff375f); }
.swatch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.theme-row { display: flex; align-items: center; justify-content: space-between; }
.appearance { position: relative; display: flex; gap: 2px; padding: 3px; border-radius: 22px; background: var(--raised); }
.appearance button { position: relative; z-index: 1; width: 44px; height: 36px; border: 0; background: none; color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: color 240ms ease; }
.appearance button.on { color: var(--onaccent); }
.chip { position: absolute; top: 3px; left: 3px; width: 44px; height: 36px; border-radius: 18px; background: var(--accent); transition: transform 380ms var(--spring); }

.rooms { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.room { height: 40px; border-radius: 20px; border: 0; background: var(--raised); color: var(--text); font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; transition: background-color 180ms ease, color 180ms ease, transform 300ms var(--pop); }
.room:active { transform: scale(0.95); }
.room.on { background: var(--accent); color: var(--onaccent); }
.field { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-radius: 16px; background: var(--raised); color: var(--muted); flex: none; }
.field label { font-size: 15px; width: 96px; flex: none; }
.field input { flex: 1; min-width: 0; border: 0; background: none; color: var(--text); font-size: 17px; outline: none; -webkit-user-select: text; user-select: text; }
.field input::placeholder { color: var(--mutednum); }
.primary { height: 52px; border-radius: 26px; border: 0; background: var(--accent); color: var(--onaccent); font-size: 17px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; flex: none; transition: opacity 200ms ease, transform 300ms var(--pop); }
.primary:active { transform: scale(0.97); }
.primary:disabled { opacity: 0.35; cursor: default; }
.message { text-align: center; font-size: 15px; color: var(--text); display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 20px; }
.message.dim { color: var(--muted); }
.pin-input { height: 64px; border-radius: 16px; background: var(--raised); border: 0; text-align: center; font-size: 28px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; outline: none; -webkit-user-select: text; user-select: text; }
.pin-input:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.pin-input::placeholder { color: var(--mutednum); font-size: 22px; font-weight: 500; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin 700ms linear infinite; flex: none; opacity: 0.8; }
@keyframes spin { to { transform: rotate(360deg); } }

.dial-wrap { position: relative; width: 280px; height: 280px; align-self: center; touch-action: none; cursor: grab; border-radius: 50%; flex: none; }
.dial-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.dial-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; pointer-events: none; color: var(--text); }
.dial-time { display: flex; align-items: baseline; font-size: 46px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dial-secs { display: inline-flex; align-items: baseline; font-size: 22px; font-weight: 500; color: var(--muted); }
.dial-sub { font-size: 14px; color: var(--muted); min-height: 18px; }
.foot { display: flex; justify-content: center; min-height: 40px; }
.foot .pill { align-self: center; }

.pad { position: relative; flex: 1; min-height: 0; touch-action: none; cursor: pointer; }
.pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.keys { display: flex; justify-content: center; gap: 16px; }
.key { width: 60px; height: 60px; border-radius: 30px; border: 0; background: var(--raised); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 300ms var(--pop); }
.key:active { transform: scale(0.92); }

.search { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 14px; background: var(--raised); color: var(--muted); flex: none; }
.search input { flex: 1; border: 0; background: none; color: var(--text); font-size: 17px; outline: none; -webkit-user-select: text; user-select: text; }
.search input::placeholder { color: var(--mutednum); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; flex: none; }
.chips::-webkit-scrollbar { display: none; }
.inchip { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px 0 6px; border-radius: 21px; border: 0; background: var(--raised); color: var(--text); font-size: 15px; font-weight: 500; white-space: nowrap; cursor: pointer; flex: none; }
.inchip.on { background: var(--accent); color: var(--onaccent); }
.approw { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 18px; background: var(--raised); flex: none; }
.approw .open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font-size: 17px; font-weight: 500; color: var(--text); }
.pinbtn { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--icontile); color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; transition: background-color 200ms ease, color 200ms ease, transform 300ms var(--pop); }
.pinbtn.on { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
.pinbtn:active { transform: scale(0.9); }

.fade-in { animation: fadein 260ms ease both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }


/* ---------- Now-playing strip ---------- */
.tv-status:empty { display: none; }
.scroll { padding-bottom: 112px; }
.ic.fill { fill: currentColor; stroke: none; }
.player { position: absolute; z-index: 15; left: 12px; right: 12px; bottom: 26px; height: 64px; border-radius: 20px; background: var(--brand, #2C2C30); color: #fff; overflow: hidden; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3); transition: left 520ms var(--spring), right 520ms var(--spring), bottom 520ms var(--spring), height 520ms var(--spring), border-radius 520ms var(--spring), background-color 420ms ease, box-shadow 420ms ease, transform 460ms var(--spring), opacity 260ms ease; touch-action: none; -webkit-user-select: none; user-select: none; }
.player::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(0, 0, 0, 0.22)); pointer-events: none; }
.player.hidden { transform: translateY(150%); opacity: 0; pointer-events: none; }
.player.full { z-index: 25; left: 0; right: 0; bottom: 0; height: 548px; border-radius: 30px 30px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.25); }
.player.dragging { transition: none; }
.p-art { position: absolute; left: 0; top: 0; width: 210px; height: 210px; transform-origin: 0 0; transform: translate(12px, 12px) scale(0.1905); transition: transform 520ms var(--spring), box-shadow 420ms ease; border-radius: 55px; cursor: pointer; }
.p-art .appicon { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
.player.full .p-art { transform: translate(var(--fx, 90px), 86px) scale(1); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4); cursor: default; }
.p-mini { position: absolute; left: 0; right: 0; top: 0; height: 64px; display: flex; align-items: center; gap: 2px; padding: 0 8px 0 64px; transition: opacity 200ms ease; }
.player.full .p-mini { opacity: 0; pointer-events: none; }
.p-open { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 3px; background: none; border: 0; padding: 0; color: inherit; text-align: left; cursor: pointer; }
.p-title { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-sub { display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(255, 255, 255, 0.68); white-space: nowrap; }
.p-btn { width: 44px; height: 44px; border-radius: 22px; border: 0; background: none; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; transition: transform 320ms var(--pop), background-color 200ms ease; }
.p-btn:active { transform: scale(0.88); }
.p-btn:focus-visible, .p-open:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; flex: none; }
.eq i { display: block; width: 3px; height: 4px; border-radius: 1.5px; background: currentColor; transition: height 300ms ease; }
.player.playing .eq i { animation: eq 820ms ease-in-out infinite alternate; }
.player.playing .eq i:nth-child(2) { animation-delay: -270ms; animation-duration: 640ms; }
.player.playing .eq i:nth-child(3) { animation-delay: -540ms; animation-duration: 940ms; }
@keyframes eq { from { height: 3px; } to { height: 11px; } }
.p-full { position: absolute; left: 0; right: 0; top: 0; height: 548px; opacity: 0; pointer-events: none; transition: opacity 180ms ease; }
.player.full .p-full { opacity: 1; pointer-events: auto; transition: opacity 320ms ease 120ms; }
.p-grab { position: absolute; top: 6px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: rgba(255, 255, 255, 0.3); }
.p-collapse { position: absolute; left: 22px; top: 24px; width: 38px; height: 38px; background: rgba(255, 255, 255, 0.14); }
.p-meta { position: absolute; left: 28px; right: 28px; top: 320px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.p-meta .p-title { font-size: 24px; max-width: 100%; }
.p-meta .p-sub { font-size: 15px; }
.p-transport { position: absolute; left: 0; right: 0; top: 398px; display: flex; align-items: center; justify-content: center; gap: 30px; }
.p-skip { width: 62px; height: 62px; border-radius: 31px; }
.p-skip:active { background: rgba(255, 255, 255, 0.14); }
.p-main { width: 78px; height: 78px; border-radius: 39px; background: #fff; color: var(--brand, #2C2C30); box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25); }
.p-skip.nudge-back .ic { animation: nudgeBack 360ms var(--spring); }
.p-skip.nudge-fwd .ic { animation: nudgeFwd 360ms var(--spring); }
@keyframes nudgeBack { 40% { transform: translateX(-6px); } }
@keyframes nudgeFwd { 40% { transform: translateX(6px); } }
.pscrim { position: absolute; inset: 0; z-index: 24; background: rgba(0, 0, 0, 0.42); opacity: 0; pointer-events: none; transition: opacity 320ms ease; border: 0; width: 100%; padding: 0; cursor: pointer; }

  // Sleep timer: wind the ring up to 4 hours (SleepTimerSheet.swift) ------
  const MAX = 240, CX = 140, CY = 140, R_IN = 98, R_OUT = 124, TAU = Math.PI * 2;
  const dFill = spring(0, 190, 22), dAmp = spring(0, 260, 15);
  let dialDrag = false, dialMin = 0, lastAng = 0, dialRect = null, shownKey = '', sleepUndo = null, sleepUndoTimer = null;
  const P = (r, a) => [CX + r * Math.sin(a), CY - r * Math.cos(a)];
  const angDist = (a, b) => { const d = Math.abs(a - b) % TAU; return d > Math.PI ? TAU - d : d; };
  function arcPath(a0, a1, outer) {
    if (a1 - a0 < 0.002) return '';
    const n = Math.max(2, Math.ceil((a1 - a0) / 0.03));
    let d = '';
    for (let i = 0; i <= n; i++) { const a = a0 + ((a1 - a0) * i) / n; const [x, y] = P(outer(a), a); d += (i ? ' L' : 'M') + f2(x) + ' ' + f2(y); }
    const re = (outer(a1) - R_IN) / 2, [ix, iy] = P(R_IN, a1);
    d += ` A${f2(re)} ${f2(re)} 0 0 1 ${f2(ix)} ${f2(iy)}`;
    for (let i = n - 1; i >= 0; i--) { const a = a0 + ((a1 - a0) * i) / n; const [x, y] = P(R_IN, a); d += ` L${f2(x)} ${f2(y)}`; }
    const rs = (outer(a0) - R_IN) / 2, [ox, oy] = P(outer(a0), a0);
    return d + ` A${f2(rs)} ${f2(rs)} 0 0 1 ${f2(ox)} ${f2(oy)} Z`;
  }
  function drawDial() {
    if (sheetKind !== 'sleep' || !$('dialFill')) return;
    const endA = (clamp(dFill.v, 0, MAX) / MAX) * TAU;
    const outer = (a) => R_OUT + dAmp.v * Math.exp(-Math.pow(angDist(a, endA) / 0.36, 2));
    $('dialTrack').setAttribute('d', arcPath(0, TAU - 0.001, outer));
    $('dialFill').setAttribute('d', dFill.v > 0.3 ? arcPath(0, Math.min(endA, TAU - 0.001), outer) : '');
  }
  drawers.push(drawDial);
  const remainingMs = () => { const t = tv(); return t.sleepEnd ? Math.max(0, t.sleepEnd - Date.now()) : 0; };
  const snap = (m) => Math.round(m / 5) * 5;
  function renderDialText() {
    if (!$('dH')) return;
    const t = tv();
    let min, secs = null, sub;
    if (dialDrag) { min = snap(dialMin); sub = min ? 'Off at ' + clock(Date.now() + min * 60000) : ''; }
    else if (t.sleepEnd) { const total = Math.ceil(remainingMs() / 1000); min = Math.floor(total / 60); secs = total % 60; sub = 'Off at ' + clock(t.sleepEnd); }
    else { min = 0; sub = ''; }
    const key = min + ':' + secs + ':' + sub;
    if (key === shownKey) return;
    shownKey = key;
    roll($('dH'), String(Math.floor(min / 60)));
    roll($('dM'), String(min % 60).padStart(2, '0'));
    $('dSecs').hidden = secs == null;

  function renderSleepFoot() {

    if (foot.dataset.key === key) return;

    foot.innerHTML = key === 'on' ? `<button class="pill" id="cancelSleep">${ic('close', 18)}Cancel timer</button>`
      : key === 'undo' ? `<button class="pill" id="undoSleep">${ic('back', 18)}Undo</button>` : '';

      sleepUndo = null; dAmp.vel += 120; renderAll(); dFill.t = remainingMs() / 60000; kick();
    });
  }
  function setSleep(m) {
    const t = tv();
    if (m <= 0) {
      if (t.sleepEnd) {
        sleepUndo = { id: t.id, end: t.sleepEnd };
        clearTimeout(sleepUndoTimer);
        sleepUndoTimer = setTimeout(() => { sleepUndo = null; renderSleepFoot(); }, 5000);
      }

  function renderSleep() {
    body.innerHTML = head('Sleep timer') + `
      <div class="dial-wrap" id="dial" role="slider" tabindex="0" aria-label="Sleep timer, up to 4 hours" aria-valuemin="0" aria-valuemax="240">
        <svg viewBox="0 0 280 280" aria-hidden="true"><path id="dialTrack" style="fill: var(--track)"></path><path id="dialFill" style="fill: var(--accent)"></path></svg>
        <div class="dial-center"><div class="dial-time" aria-hidden="true"><span class="roll" id="dH"></span><span>:</span><span class="roll" id="dM"></span><span class="dial-secs" id="dSecs" hidden><span>:</span><span class="roll" id="dS"></span></span></div><div class="dial-sub" id="dialSub"> </div></div>
      </div><div class="foot" id="sleepFoot"></div>`;
    shownKey = '';
    const dial = $('dial');
    // Opening the sheet winds the ring up from zero to the time left.
    dFill.v = 0; dFill.vel = 0; dFill.t = remainingMs() / 60000; dAmp.v = 0; dAmp.t = 0; dAmp.vel = 70;

    requestAnimationFrame(() => { drawDial(); kick(); });
    const angOf = (e) => { const r = dialRect || dial.getBoundingClientRect(); let a = Math.atan2(e.clientX - (r.left + r.width / 2), -(e.clientY - (r.top + r.height / 2))); return a < 0 ? a + TAU : a; };

      const step = { ArrowRight: 5, ArrowUp: 5, ArrowLeft: -5, ArrowDown: -5 }[e.key];
      if (!step) return;
      e.preventDefault(); dAmp.vel += 90; setSleep(clamp(snap(remainingMs() / 60000) + step, 0, MAX));
    });
  }

  // Navigate: the dot-grid touch surface (NavigateSheet.swift) -------------
  let padDraw = null;
  function renderNavigate() {
    body.innerHTML = head('Navigate') + `<div class="pad" id="pad" tabindex="0" role="application" aria-label="Touch surface. Swipe to move, tap to select. Arrow keys and Enter work too."><canvas id="padCanvas"></canvas></div>
      <div class="keys"><button class="key" id="backKey" aria-label="Back">${ic('back', 24)}</button><button class="key" id="homeKey" aria-label="Home">${ic('home', 24)}</button></div>`;
    const pad = $('pad'), canvas = $('padCanvas'), ctx = canvas.getContext('2d');
    const SPACING = 28, DOT = 2.6, REACH = 96, STEP = 72, STRAIGHT = 1.6;
    let touch = { x: -999, y: -999 }, touching = false, touchedAt = 0, releasedAt = 0, flashedAt = 0, anim = null;
    let anchor = { x: 0, y: 0 }, start = null, farthest = 0, steps = 0, startT = 0, lastMoves = [];
    const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
    const textColor = () => getComputedStyle($('device')).getPropertyValue('--text').trim() || '#fff';
    function draw() {
      const w = pad.clientWidth, h = pad.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
      if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      const now = performance.now();
      const level = touching ? Math.min(1, (now - touchedAt) / 180) : Math.max(0, (flashedAt >= touchedAt ? 1 : Math.min(1, (releasedAt - touchedAt) / 180)) * (1 - (now - releasedAt) / 400));
      const flash = Math.max(0, 1 - (now - flashedAt) / 300);
      const color = textColor();
      const cols = Math.floor(w / SPACING), rows = Math.floor(h / SPACING);

      ctx.fillStyle = color;
      for (let r = 0; r <= rows; r++) {
        const y = y0 + r * SPACING;
        const fade = Math.min(smooth(y / (h * 0.12)), smooth((h - y) / (h * 0.12)));
        for (let c = 0; c <= cols; c++) {
          const x = x0 + c * SPACING, dist = Math.hypot(x - touch.x, y - touch.y);

          if (level > 0 && dist < REACH) op = 0.08 + (0.55 + 0.4 * flash - 0.08) * smooth(1 - dist / REACH) * level;

      touching = true; touchedAt = performance.now(); lastMoves = [{ ...touch, t: startT }]; kickPad();
    });
    pad.addEventListener('pointermove', (e) => {
      if (!touching) return;
      touch = local(e);
      const now = performance.now();
      lastMoves.push({ ...touch, t: now }); lastMoves = lastMoves.filter((m) => now - m.t < 100);
      const tx = touch.x - start.x, ty = touch.y - start.y;
      farthest = Math.max(farthest, Math.hypot(tx, ty));
      const dx = tx - anchor.x, dy = ty - anchor.y;
      const major = Math.max(Math.abs(dx), Math.abs(dy)), minor = Math.min(Math.abs(dx), Math.abs(dy));
      if (major < STEP || major < minor * STRAIGHT) return;
      if (Math.abs(dx) > Math.abs(dy)) anchor = { x: anchor.x + (dx > 0 ? STEP : -STEP), y: ty };
      else anchor = { x: tx, y: anchor.y + (dy > 0 ? STEP : -STEP) };
      steps++; send();
    });
    const up = () => {
      if (!touching) return;
      touching = false; releasedAt = performance.now();
      const quick = releasedAt - startT < 350;
      if (steps === 0 && farthest < 12 && quick) { send(); return; }
      const first = lastMoves[0], last = lastMoves[lastMoves.length - 1];
      if (first && last && last.t > first.t) {
        const vx = ((last.x - first.x) / (last.t - first.t)) * 1000, vy = ((last.y - first.y) / (last.t - first.t)) * 1000;
        const speed = Math.max(Math.abs(vx), Math.abs(vy)), straight = speed >= Math.min(Math.abs(vx), Math.abs(vy)) * STRAIGHT;
        const extra = speed > 1000 && straight ? (steps === 0 ? 1 : 0) + (speed > 2400 ? 1 : 0) : 0;
        for (let i = 0; i < extra; i++) setTimeout(send, i * 120);
      }
      kickPad();
    };
    pad.addEventListener('pointerup', up); pad.addEventListener('pointercancel', up);
    pad.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', ' '].includes(e.key)) {
        e.preventDefault(); touch = { x: pad.clientWidth / 2, y: pad.clientHeight / 2 }; touchedAt = performance.now() - 200; releasedAt = performance.now(); send();
      }
    });
    const press = () => {};
    $('backKey').addEventListener('click', press); $('homeKey').addEventListener('click', press);
    requestAnimationFrame(draw);
    teardown = () => { if (anim) cancelAnimationFrame(anim); anim = null; padDraw = null; };
  }

  // All apps ---------------------------------------------------------------
  function renderAllApps() {
    const t = tv(), st = sheetState;
    if (st.query == null) st.query = '';
    const q = st.query.trim().toLowerCase();
    const match = (n) => !q || n.toLowerCase().includes(q);
    const inputs = t.inputs.filter(match), apps = t.apps.slice().sort((a, b) => a.localeCompare(b)).filter(match);
    const results = !inputs.length && !apps.length
      ? `<div class="muted" style="text-align:center;margin-top:40px">No apps match “${esc(st.query)}”.</div>`
      : (inputs.length ? `<span class="subhead">Inputs</span><div class="chips">${inputs.map((i) => `<button class="inchip${t.app === i ? ' on' : ''}" data-input="${esc(i)}" aria-label="Switch to ${esc(i)}">${appIcon(i, 28)}${esc(i)}${t.pins.includes(i) ? ic('pin-fill', 14) : ''}</button>`).join('')}</div>` : '') +
        (apps.length ? `<span class="subhead">Apps</span>` + apps.map((a) => {
          const pinned = t.pins.includes(a);
          return `<div class="approw"><button class="open" data-open="${esc(a)}" aria-label="Open ${esc(a)}">${appIcon(a, 44)}<span>${esc(a)}</span></button><button class="pinbtn${pinned ? ' on' : ''}" data-pin="${esc(a)}" aria-label="${pinned ? 'Unpin ' + esc(a) + ' from' : 'Pin ' + esc(a) + ' to'} Favorites">${ic(pinned ? 'pin-fill' : 'pin', 20)}</button></div>`;
        }).join('') : '');
    const list = `<div class="sheet-scroll" id="appsList" style="padding-bottom:16px">${results}</div>`;
    if (!$('appsQuery')) {
      body.innerHTML = head('All apps') + `<div class="search">${ic('search', 20)}<input id="appsQuery" placeholder="Search" aria-label="Search" autocomplete="off" spellcheck="false"></div>` + list;
      $('appsQuery').addEventListener('input', (e) => { st.query = e.target.value; renderAllApps(); });
    } else {
      $('appsList').outerHTML = list;
    }
    body.querySelectorAll('[data-open]').forEach((b) => b.addEventListener('click', () => { launch(b.dataset.open); closeSheet(); }));
    body.querySelectorAll('[data-input]').forEach((b) => {
      b.addEventListener('click', () => { launch(b.dataset.input); closeSheet(); });
      longPress(b, () => showMenu(b, [{ title: t.pins.includes(b.dataset.input) ? 'Unpin from Favorites' : 'Pin to Favorites', icon: t.pins.includes(b.dataset.input) ? 'unpin' : 'pin', run: () => togglePin(b.dataset.input) }]));
    });
    body.querySelectorAll('[data-pin]').forEach((b) => b.addEventListener('click', () => togglePin(b.dataset.pin)));
  }
  function togglePin(title) {
    const t = tv();
    t.pins = t.pins.includes(title) ? t.pins.filter((p) => p !== title) : t.pins.concat(title);
    renderFavorites();
    if (sheetKind === 'allApps') renderAllApps();
  }

  // ---------- Now-playing strip ----------
  // Collapsed it sits over the bottom of the screen; tap or swipe up to open it, drag down to put it away.
  // The TVs report which app is on screen, not the show or how far into it you are, so there's no title or progress bar.
  const player = $('player'), pScrim = $('pScrim');
  tvs.forEach((t) => { t.playing = true; });
  // A dark shade of each app's brand color, like Spotify tinting the player with the album art.
  const BRAND = { 'HBO Max': '#2E1466', 'Apple TV': '#1F1F22' };
  function brand(title) {
    if (BRAND[title]) return BRAND[title];
    const l = LOGOS[title];
    if (!l) return '#2C2C30';
    const plain = (c) => /^#(fff|ffffff|000|000000)$/i.test(c);
    const c = plain(l.glyph) ? l.tile : l.glyph;
    const [r, g, b] = toRGB(parseInt(c.slice(1), 16));
    return toHex([r * 0.42, g * 0.42, b * 0.42]);
  }
  let expanded = false, artTitle = null;
  function fitPlayer() { player.style.setProperty('--fx', ($('device').clientWidth - 210) / 2 + 'px'); }
  function renderPlayer() {
    const t = tv(), show = t.on && !!t.app;
    player.classList.toggle('hidden', !show);
    if (!show) { if (expanded) collapse(); return; }
    player.style.setProperty('--brand', brand(t.app));
    player.classList.toggle('playing', !!t.playing);
    if (artTitle !== t.app) { $('pArt').innerHTML = appIcon(t.app, 210); artTitle = t.app; }
    $('pMiniTitle').textContent = $('pTitle').textContent = t.app;
    $('pMiniSub').textContent = $('pSub').textContent = t.name;
    const label = (t.playing ? 'Pause ' : 'Play ') + t.app;
    $('pMiniPlay').innerHTML = ic(t.playing ? 'pause' : 'play', 24);
    $('pPlay').innerHTML = ic(t.playing ? 'pause' : 'play', 34);
    $('pMiniPlay').setAttribute('aria-label', label);
    $('pPlay').setAttribute('aria-label', label);
  }
  function expand() {
    if (expanded || player.classList.contains('hidden')) return;
    fitPlayer();
    expanded = true;
    player.classList.add('full'); pScrim.classList.add('open');
    app.inert = true;
    $('pOpen').tabIndex = -1; $('pMiniPlay').tabIndex = -1;
    setTimeout(() => $('pCollapse').focus({ preventScroll: true }), 120);
  }
  function collapse() {
    if (!expanded) return;
    expanded = false;
    player.classList.remove('full', 'dragging'); player.style.transform = '';
    pScrim.classList.remove('open');
    app.inert = false;
    $('pOpen').tabIndex = 0; $('pMiniPlay').tabIndex = 0;
  }
  const togglePlay = () => { const t = tv(); t.playing = !t.playing; renderPlayer(); };
  $('pMiniPlay').addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
  $('pPlay').addEventListener('click', togglePlay);
  $('pCollapse').addEventListener('click', collapse);
  pScrim.addEventListener('click', collapse);
  const nudge = (btn, cls) => { btn.classList.remove(cls); void btn.offsetWidth; btn.classList.add(cls); };
  $('pBack').addEventListener('click', () => nudge($('pBack'), 'nudge-back'));
  $('pFwd').addEventListener('click', () => nudge($('pFwd'), 'nudge-fwd'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && expanded) collapse(); });
  // Tap or swipe up on the strip to open; drag the open player down to put it away.
  (() => {
    let y0 = null, dy = 0, opened = false;
    const scale = () => $('device').getBoundingClientRect().width / $('device').offsetWidth || 1;
    player.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#pMiniPlay, .p-transport, #pCollapse')) return;
      y0 = e.clientY; dy = 0; opened = false;
      player.setPointerCapture?.(e.pointerId);
    });
    player.addEventListener('pointermove', (e) => {
      if (y0 == null) return;
      dy = (e.clientY - y0) / scale();
      if (!expanded) { if (dy < -24 && !opened) { opened = true; expand(); } return; }
      if (dy > 0) { player.classList.add('dragging'); player.style.transform = `translateY(${dy}px)`; }
    });
    const up = () => {
      if (y0 == null) return;
      y0 = null;
      if (expanded && player.classList.contains('dragging')) {
        player.classList.remove('dragging');
        if (dy > 110) collapse(); else player.style.transform = '';
        return;
      }
      if (!expanded && !opened && Math.abs(dy) < 8) expand();
    };
    player.addEventListener('pointerup', up);
    player.addEventListener('pointercancel', () => { y0 = null; player.classList.remove('dragging'); player.style.transform = ''; });
    // Keyboard: the strip's text is a button.
    $('pOpen').addEventListener('click', (e) => { if (e.detail === 0) expand(); });
  })();

  // ---------- Fit the device frame to the window ----------
  function fit() {
    const phone = window.matchMedia('(max-width: 500px)').matches;
    const s = phone ? 1 : Math.min(1, (window.innerHeight - 40) / 866, (window.innerWidth - 32) / 412);
    $('fit').style.setProperty('--s', f2(Math.max(0.5, s)));
    VW = volBar.clientWidth || VW;
    $('volSvg').setAttribute('viewBox', `0 0 ${VW} 96`);
    vX.v = vX.t = (tv().volume / 100) * VW; vX.vel = 0;
    drawVol();
    if (sheetKind) setHeight();
    fitPlayer();
  }
  window.addEventListener('resize', fit);

  setInterval(() => {
    let changed = false;
    tvs.forEach((t) => { if (t.sleepEnd && t.sleepEnd <= Date.now()) { t.on = false; t.sleepEnd = null; t.app = null; changed = true; } });
    if (changed) { renderAll(); return; }
    if (tv().sleepEnd) {
      $('tvStatus').textContent = headerStatus(tv());
      renderTiles();
      if (sheetKind === 'sleep' && !dialDrag) { dFill.t = remainingMs() / 60000; renderDialText(); kick(); }
    }
  }, 1000);

  // Back to the list: return to it if we came from it, else follow the link.
  $('backLink').addEventListener('click', (e) => { if (document.referrer && history.length > 1) { e.preventDefault(); history.back(); } });
  hydrate(document);
  applyColors();
  renderAll();
  fit();
})();
</script>
</body>
</html>
