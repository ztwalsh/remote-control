<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>LG Remote Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Layout: one iPhone-sized app. On a desktop it sits in a device frame scaled to the window; on a phone it fills the screen. */
:root {
  --stage: #050506;
  --bg: #0B0B0C;
  --card: #141415;
  --raise: #1D1D1F;
  --line: rgba(255, 255, 255, 0.07);
  --line-strong: rgba(255, 255, 255, 0.11);
  --text: #F2F2F3;
  --muted: #8B8B90;
  --dim: #808086;
  --track: #2A2A2D;
  --track-alt: #303034;
  --blue: #0A84FF;
  --on-blue: #FFFFFF;
  --font: "Geist", "SF Pro Text", -apple-system, "Helvetica Neue", system-ui, sans-serif;
  --spring: cubic-bezier(.2, .9, .1, 1);
  --pop: cubic-bezier(.34, 1.56, .64, 1);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--stage); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:focus { outline: none; }
button:focus-visible, .bar:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: -1px; padding: 0; border: 0; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic-md { width: 22px; height: 22px; }

.stage { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.fit { position: relative; width: calc(412px * var(--s, 1)); height: calc(866px * var(--s, 1)); flex: none; }
/* The frame's shadow lives on its own element so animations inside the phone never repaint it. */
.fit::before { content: ""; position: absolute; inset: 0; border-radius: calc(58px * var(--s, 1)); box-shadow: 0 0 0 1px var(--line-strong), 0 40px 120px rgba(0, 0, 0, 0.7); pointer-events: none; }
.device { width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); border: 11px solid #19191B; border-radius: 58px; transform: scale(var(--s, 1)); transform-origin: top left; }

.app { position: absolute; inset: 0; box-sizing: border-box; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 16px; padding: 60px 16px 34px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.app::-webkit-scrollbar { display: none; }

/* Header: TV switcher + power */
.top { display: flex; align-items: center; gap: 12px; }
.tv-switch { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; background: none; border: 0; padding: 4px 0; text-align: left; cursor: pointer; }
.tv-name { display: flex; align-items: center; gap: 6px; font-size: 27px; font-weight: 600; letter-spacing: -0.015em; }
.tv-name .ic { color: var(--muted); transition: transform 300ms var(--spring); }
.tv-switch:active .tv-name .ic { transform: translateY(2px); }
.tv-sub { display: flex; gap: 6px; align-items: baseline; font-size: 15px; color: var(--muted); white-space: nowrap; }
.tv-sub b { font-weight: 500; color: var(--text); }
.power { width: 54px; height: 54px; border-radius: 27px; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; background: var(--blue); color: var(--on-blue); transition: background-color 260ms ease, color 260ms ease, opacity 200ms ease, transform 420ms var(--pop); }
.power:active { transform: scale(0.92); }
.app.is-off .power { visibility: hidden; opacity: 0; transform: scale(0.8); transition: opacity 200ms ease, transform 300ms var(--spring), visibility 0s 200ms; }

/* Cards */
.tools, .offpanel { transition: opacity 320ms ease, transform 420ms var(--spring); }
.tools { display: flex; flex-direction: column; gap: 12px; }
.app.is-off .tools { opacity: 0; transform: scale(0.97) translateY(8px); pointer-events: none; position: absolute; left: 16px; right: 16px; visibility: hidden; transition: opacity 320ms ease, transform 420ms var(--spring), visibility 0s 320ms; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 26px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.card h2, .sheet h2 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
.stat { display: flex; align-items: baseline; gap: 6px; margin-top: 6px; font-size: 16px; white-space: nowrap; color: var(--muted); }
.stat .roll { color: var(--text); font-weight: 500; }
.note { color: var(--muted); font-weight: 500; }

.roll { display: inline-flex; height: 1.25em; line-height: 1.25em; overflow: hidden; font-variant-numeric: tabular-nums; transition: color 240ms ease; }
.roll .col { display: block; height: 1.25em; overflow: hidden; }
.roll .stack { display: flex; flex-direction: column; transition: transform 520ms var(--spring); will-change: transform; }
.roll.fast .stack { transition-duration: 120ms; }

.pill { height: 38px; padding: 0 14px; border-radius: 19px; border: 0; background: var(--raise); display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 15px; flex: none; }
.round { width: 38px; height: 38px; border-radius: 19px; border: 0; background: var(--raise); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; transition: background-color 220ms ease, color 220ms ease; }
.round[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.stepper { display: flex; height: 38px; border-radius: 19px; background: var(--raise); overflow: hidden; }
.stepper button { width: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: none; }
.stepper button:active { background: rgba(255, 255, 255, 0.06); }
.stepper i { width: 1px; margin: 10px 0; background: var(--line-strong); }
.controls { display: flex; gap: 8px; align-items: center; }

/* Bulging capsule bar + floating tooltip */
.bar { position: relative; padding-top: 42px; touch-action: none; cursor: pointer; user-select: none; -webkit-user-select: none; }
.bar.vol { cursor: ew-resize; margin-top: -26px; }
.bar svg { display: block; width: 100%; overflow: visible; will-change: transform; }
.tip { position: absolute; top: 0; left: 0; z-index: 2; pointer-events: none; opacity: 0; transform: translateX(-50%) translateY(4px) scale(0.92); transition: opacity 160ms ease, transform 240ms var(--spring); will-change: transform, opacity; }
.tip.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
.tip.glide { transition: opacity 160ms ease, transform 240ms var(--spring), left 240ms var(--spring); }
.tip-body { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 12px; background: #161618; border: 1px solid var(--line-strong); white-space: nowrap; font-size: 14px; font-variant-numeric: tabular-nums; }
.tip-body span:last-child { color: var(--muted); }
.tip::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 9px; height: 9px; margin-left: -5px; background: #161618; border-right: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); transform: rotate(45deg); }
.dot { width: 9px; height: 9px; border-radius: 5px; background: var(--blue); flex: none; }
.seg { transition: opacity 240ms ease; }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; cursor: pointer; text-align: left; transition: transform 420ms var(--pop); }
.tile:active { transform: scale(0.97); }
.tile .ic-md { color: var(--blue); }
.tile-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile-label { font-size: 13px; color: var(--muted); }
.tile-value { font-size: 16px; font-weight: 600; }

/* Favorites */
.apps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 8px; }
.app-btn { position: relative; background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 7px; cursor: pointer; transition: opacity 260ms ease; }
.apps.pressing .app-btn:not(.pressed) { opacity: 0.32; }
.app-icon { width: 62px; height: 62px; border-radius: 16px; background: var(--raise); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08); transition: transform 460ms var(--pop), box-shadow 260ms ease; }
.app-icon svg { display: block; }
.app-btn.pressed .app-icon { transform: translateY(-3px) scale(1.1); }
.app-btn.current .app-icon { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 0 0 2px var(--card), 0 0 0 3.5px var(--blue); }
.app-name { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #B4B4B9; white-space: nowrap; }
.app-name .dot { width: 6px; height: 6px; opacity: 0; transition: opacity 240ms ease; }
.app-btn.current .app-name .dot { opacity: 1; }
.app-tip { position: absolute; bottom: calc(100% + 6px); left: 50%; z-index: 3; }
.app-tip .tip-body { height: 30px; font-size: 13px; }

/* Off state */
.offpanel { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; padding-bottom: 60px; }
.app.is-off .offpanel { display: flex; animation: rise 520ms var(--spring) both; }
.wake { width: 168px; height: 168px; border-radius: 84px; border: 1.5px solid var(--line-strong); background: var(--card); color: var(--blue); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 460ms var(--pop); }
.wake:active { transform: scale(0.95); }
.wake .ic { width: 54px; height: 54px; stroke-width: 1.8; }
.off-title { font-size: 22px; font-weight: 600; }
.off-help { margin: 8px 0 0; max-width: 270px; font-size: 14px; line-height: 1.5; color: var(--muted); }
.off-undo { display: flex; align-items: center; gap: 10px; min-height: 38px; }

/* Bottom sheet */
.scrim { position: absolute; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.6); opacity: 0; pointer-events: none; transition: opacity 320ms ease; border: 0; width: 100%; padding: 0; cursor: pointer; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card); border-top: 1px solid var(--line-strong); border-radius: 30px 30px 0 0; padding: 10px 20px 38px; display: flex; flex-direction: column; gap: 16px; transform: translateY(calc(100% + 40px)); transition: transform 460ms var(--spring); visibility: hidden; }
.sheet.open { transform: translateY(0); visibility: visible; }
.sheet.dragging { transition: none; }
.sheet:not(.open) { transition: transform 360ms var(--spring), visibility 0s 360ms; }
.grab-zone { display: flex; flex-direction: column; gap: 14px; touch-action: none; cursor: grab; }
.grabber { width: 40px; height: 5px; border-radius: 3px; background: #3A3A3E; align-self: center; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-sub { font-size: 15px; color: var(--muted); margin-top: 4px; display: block; }
.panel { display: none; flex-direction: column; gap: 10px; }
.sheet[data-kind="tvs"] .panel.tvs, .sheet[data-kind="speaker"] .panel.speaker, .sheet[data-kind="sleep"] .panel.sleep { display: flex; }

.choice { display: flex; align-items: center; gap: 8px; background: var(--raise); border-radius: 20px; padding: 6px; box-shadow: inset 0 0 0 1.5px transparent; transition: box-shadow 260ms ease, transform 420ms var(--pop); }
.choice.selected { box-shadow: inset 0 0 0 1.5px var(--blue); }
.choice:has(.choice-pick:active) { transform: scale(0.985); }
.choice-pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; background: none; border: 0; padding: 4px 0 4px 6px; cursor: pointer; text-align: left; }
.choice-icon { width: 42px; height: 42px; border-radius: 13px; background: #2A2A2E; color: var(--muted); display: flex; align-items: center; justify-content: center; flex: none; transition: background-color 260ms ease, color 260ms ease; }
.choice.selected .choice-icon { background: rgba(10, 132, 255, 0.16); color: var(--blue); }
.row-text { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-title { font-size: 17px; font-weight: 600; }
.row-sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.choice-end { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; flex: none; }
.radio { width: 24px; height: 24px; border-radius: 12px; box-shadow: inset 0 0 0 2px #4A4A4E; display: flex; align-items: center; justify-content: center; color: var(--on-blue); transition: background-color 240ms ease, box-shadow 240ms ease, transform 420ms var(--pop); }
.radio .ic { width: 14px; height: 14px; stroke-width: 3; opacity: 0; transform: scale(0.4); transition: opacity 200ms ease, transform 420ms var(--pop); }
.choice.selected .radio { background: var(--blue); box-shadow: inset 0 0 0 2px var(--blue); }
.choice.selected .radio .ic { opacity: 1; transform: none; }
.row-power { width: 46px; height: 46px; border-radius: 23px; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; background: #2C2C30; color: #C9C9CE; transition: background-color 240ms ease, color 240ms ease, transform 420ms var(--pop); }
.row-power:active { transform: scale(0.9); }
.row-power[aria-pressed="true"] { background: var(--blue); color: var(--on-blue); }
.add-row { height: 52px; border-radius: 18px; border: 1.5px dashed #3A3A3E; background: none; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; font-size: 15px; font-weight: 500; color: #C9C9CE; }

.dial-wrap { position: relative; width: 280px; height: 280px; align-self: center; touch-action: none; cursor: grab; border-radius: 50%; }
.dial-wrap:active { cursor: grabbing; }
.dial-wrap:focus-visible { outline: 2px solid var(--blue); outline-offset: 6px; }
.dial-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; will-change: transform; }
.dial-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; pointer-events: none; text-align: center; }
.dial-time { display: flex; align-items: baseline; font-size: 46px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.dial-secs { display: inline-flex; align-items: baseline; font-size: 22px; font-weight: 500; color: var(--muted); }
.dial-sub { font-size: 14px; color: var(--muted); max-width: 150px; line-height: 1.35; }
.sleep-foot { display: flex; align-items: center; justify-content: center; min-height: 40px; }

.toast { position: absolute; left: 50%; bottom: 30px; z-index: 30; pointer-events: none; opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.96); transition: opacity 220ms ease, transform 360ms var(--spring); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
.toast .tip-body { height: 40px; font-size: 14px; padding: 0 14px; }
.toast .tip-body span:last-child { color: var(--text); }

.morph { animation: morph 320ms var(--spring) both; }
@keyframes morph { from { opacity: 0; transform: translateY(5px) scale(0.96); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: none; } }

@media (max-width: 500px) {
  body { background: var(--bg); }
  .stage { padding: 0; gap: 0; }
  .fit { width: 100%; height: 100%; }
  .fit::before { display: none; }
  .device { width: 100%; height: 100%; border: 0; border-radius: 0; transform: none; }
  .app { padding: 18px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px)); }
  .app.is-off .tools { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
  .sheet { padding-bottom: max(28px, env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}
</style>
</head>
<body>

<div class="stage">
  <div class="fit" id="fit">
    <div class="device">
      <div class="app" id="app">
        <header class="top">
          <button class="tv-switch" id="tvBtn" aria-haspopup="dialog">
            <span class="tv-name"><span id="tvName">Living room</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
            <span class="tv-sub"><span id="tvStatus">Watching Netflix</span></span>
          </button>
          <button class="power" id="powerBtn" aria-pressed="true" aria-label="Turn off Living room">
            <svg class="ic ic-md" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8"></path><path d="M6.3 6.8a8 8 0 1 0 11.4 0"></path></svg>
          </button>
        </header>

        <main class="tools" id="tools">
          <section class="card" aria-labelledby="volTitle">
            <div class="card-head">
              <div>
                <h2 id="volTitle">Volume</h2>
                <div class="stat"><span class="roll" id="volRoll" aria-hidden="true"></span><span>of 100</span></div>
              </div>
              <div class="controls">
                <button class="round" id="muteBtn" aria-pressed="false" aria-label="Mute">
                  <svg class="ic" id="muteIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
                </button>
                <div class="stepper">
                  <button id="volDown" aria-label="Volume down"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"></path></svg></button>
                  <i aria-hidden="true"></i>
                  <button id="volUp" aria-label="Volume up"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"></path><path d="M12 6v12"></path></svg></button>
                </div>
              </div>
            </div>
            <div class="bar vol" id="volBar" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="18">
              <div class="tip" id="volTip"><div class="tip-body"><span class="dot"></span><span id="volTipVal" style="color: var(--text)">18</span></div></div>
              <svg id="volSvg" height="60" aria-hidden="true"><path id="volTrack" fill="#2A2A2D"></path><path id="volFill" fill="#0A84FF"></path></svg>
            </div>
          </section>

          <div class="tiles">
            <button class="tile" id="soundTile" aria-haspopup="dialog">
              <svg class="ic ic-md" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2"></rect><circle cx="12" cy="14" r="3"></circle><path d="M12 7h.01"></path></svg>
              <span class="tile-text"><span class="tile-label">Sound out</span><span class="tile-value" id="soundVal">Soundbar</span></span>
            </button>
            <button class="tile" id="sleepTile" aria-haspopup="dialog">
              <svg class="ic ic-md" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
              <span class="tile-text"><span class="tile-label">Sleep timer</span><span class="tile-value" id="sleepVal">Off</span></span>
            </button>
          </div>

          <section class="card" aria-labelledby="favTitle">
            <h2 id="favTitle">Favorites</h2>
            <div class="apps" id="apps"></div>
          </section>
        </main>

        <section class="offpanel" id="offPanel" aria-live="polite">
          <button class="wake" id="wakeBtn" aria-label="Turn on Living room">
            <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8"></path><path d="M6.3 6.8a8 8 0 1 0 11.4 0"></path></svg>
          </button>
          <div class="off-undo" id="offUndo"></div>
        </section>

        <button class="scrim" id="scrim" aria-label="Close" tabindex="-1"></button>
        <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" data-kind="tvs">
          <div class="grab-zone" id="grabZone">
            <div class="grabber" aria-hidden="true"></div>
            <div class="sheet-head">
              <h2 id="sheetTitle">Your TVs</h2>
              <button class="round" id="sheetClose" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
            </div>
          </div>

          <div class="panel tvs" id="tvList"></div>
          <div class="panel speaker" id="outList"></div>
          <div class="panel sleep">
            <div class="dial-wrap" id="dial" role="slider" tabindex="0" aria-label="Sleep timer, up to 4 hours" aria-valuemin="0" aria-valuemax="240" aria-valuenow="0">
              <svg id="dialSvg" viewBox="0 0 280 280" aria-hidden="true">
                <path class="hr" fill="#2A2A2D"></path><path class="hr" fill="#303034"></path><path class="hr" fill="#2A2A2D"></path><path class="hr" fill="#303034"></path>
                <path id="dialFill" fill="#0A84FF"></path>
              </svg>
              <div class="dial-center">
                <div class="dial-time" aria-hidden="true"><span class="roll" id="dH"></span><span>:</span><span class="roll" id="dM"></span><span class="dial-secs" id="dSecWrap" hidden><span>:</span><span class="roll" id="dS"></span></span></div>
                <div class="dial-sub" id="dialSub"></div>
              </div>
            </div>
            <div class="sleep-foot" id="sleepAction"></div>
          </div>
        </div>

        <div class="toast" id="toast" role="status"><div class="tip-body"><span class="dot"></span><span id="toastText"></span></div></div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const BLUE = '#0A84FF';

  const SPEAKERS = [
    { id: 'tv', label: 'TV speakers', icon: 'tv' },
    { id: 'soundbar', label: 'Soundbar', icon: 'soundbar' },
    { id: 'bt', label: 'Headphones', icon: 'headphones' },

    box.appendChild(b);
  }
  $('powerBtn').addEventListener('click', () => setPower(tv(), !tv().on));
  $('wakeBtn').addEventListener('click', () => setPower(tv(), true));

  function switchTv(i) {
    if (i === cur) return;
    cur = i;
    offUndo = null;
    sleepUndo = null;
    lastSleepKey = '';
    renderAll();
  }

  // ---------- Render ----------
  function renderAll() {
    const t = tv();
    morphText($('tvName'), t.name);
    morphText($('tvStatus'), status(t));
    const pb = $('powerBtn');
    pb.setAttribute('aria-pressed', String(t.on));
    pb.setAttribute('aria-label', (t.on ? 'Turn off ' : 'Turn on ') + t.name);
    app.classList.toggle('is-off', !t.on);
    $('wakeBtn').setAttribute('aria-label', 'Turn on ' + t.name);
    renderOffUndo();
    renderVolume();
    morphText($('soundVal'), SPEAKERS.find((s) => s.id === t.speaker).label);
    morphText($('sleepVal'), t.sleepEnd ? fmtMin(minsLeft(t)) + ' left' : 'Off');
    appsEl.querySelectorAll('.app-btn').forEach((b) => b.classList.toggle('current', b.dataset.name === t.app));
    renderSleep();
    if (sheetKind && !sheetLocked) renderSheet();
  }
  function renderSheet() {
    if (sheetKind === 'tvs') renderTvList();
    if (sheetKind === 'speaker') renderOutList();
    if (sheetKind) {
      $('sheetTitle').textContent = SHEETS[sheetKind];
    }
  }

  $('tvBtn').addEventListener('click', (e) => openSheet('tvs', e.currentTarget));
  $('soundTile').addEventListener('click', (e) => openSheet('speaker', e.currentTarget));
  $('sleepTile').addEventListener('click', (e) => openSheet('sleep', e.currentTarget));

  // ---------- Fit the device frame to the window ----------
  function fit() {
    const phone = window.matchMedia('(max-width: 500px)').matches;
    const s = phone ? 1 : Math.min(1, (window.innerHeight - 76) / 866, (window.innerWidth - 32) / 412);
    $('fit').style.setProperty('--s', f2(Math.max(0.5, s)));
    VW = volBar.clientWidth || VW;
    volSvg.setAttribute('viewBox', `0 0 ${VW} 60`);
    vX.v = vX.t = (tv().volume / 100) * VW;
    vX.vel = 0;
    drawVol();
  }
  window.addEventListener('resize', fit);

  // Tick once a second: the dial counts down live; the rest of the screen refreshes every 15 seconds.
  let ticks = 0;
  setInterval(() => {
    ticks++;
    let changed = false;
    tvs.forEach((t) => { if (t.sleepEnd && t.sleepEnd <= Date.now()) { t.on = false; t.sleepEnd = null; t.sleepMin = 0; t.app = null; changed = true; } });
    if (changed || (tv().sleepEnd && ticks % 15 === 0)) { renderAll(); return; }
    if (tv().sleepEnd && sheetKind === 'sleep' && !dialDrag) { dFill.t = remainingMs() / 60000; renderDialText(); kick(); }
  }, 1000);

  renderAll();
  fit();
})();
</script>
</body>
</html>
